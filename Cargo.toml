[workspace]
members = [
    "crates/kat-core",
    "crates/kat-scanner",
    "crates/kat-pipeline",
    "crates/kat-sfsymbol",
    "crates/kat-cli",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
# Internal crates
kat-core = { path = "crates/kat-core" }
kat-scanner = { path = "crates/kat-scanner" }
kat-pipeline = { path = "crates/kat-pipeline" }
kat-sfsymbol = { path = "crates/kat-sfsymbol" }

# External dependencies
anyhow = "1.0"
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.5", features = ["derive"] }
globset = "0.4"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
pathdiff = "0.2"
rayon = "1.10"
walkdir = "2.5"
blake3 = "1.5"
exif = { package = "kamadak-exif", version = "0.6.1" }
toml = "0.8"
humantime = "2.1"
quick-xml = { version = "0.31", default-features = false, features = ["serialize"] }
flate2 = { version = "1.0", default-features = false, features = ["zlib"] }
indicatif = { version = "0.17", features = ["rayon"] }
colored = "2.0"
tempfile = "3.10"

# Dev dependencies
assert_cmd = "2.0"
predicates = "3.1"
proptest = "1.4"
